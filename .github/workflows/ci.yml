name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
      
      - name: Lint with flake8
        run: |
          pip install flake8
          cd backend
          flake8 main.py --max-line-length=120 --ignore=E501,W503 || true
      
      - name: Verify imports
        run: |
          cd backend
          python -c "from main import app; print('Import OK')"
      
      - name: Verify JWT signing
        run: |
          cd backend
          python -c "import jwt; print('JWT OK')"
      
      - name: Check routes
        run: |
          cd backend
          python -c "from main import app; routes = [r.path for r in app.routes]; print('Routes:', [r for r in routes if 'auth' in r or 'users' in r])"
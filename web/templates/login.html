<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Insighta Labs+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; text-align: center; }
        .btn { display: block; width: 100%; padding: 0.75rem; background: #00d4ff; color: #1a1a2e; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #00b8e6; }
        .csrf-field { display: none; }
        .links { text-align: center; margin-top: 1rem; }
        .links a { color: #666; text-decoration: none; }
        .links a:hover { color: #00d4ff; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login to Insighta Labs+</h1>
        <form action="/github/login" method="get">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn">Login with GitHub</button>
        </form>
        <div class="links">
            <a href="/">Back to Home</a>
        </div>
    </div>
</body>
</html>

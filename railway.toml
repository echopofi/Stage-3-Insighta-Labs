# Rails/Railway Deployment Config

[build]
builder = "pip"
buildCommand = "pip install -r requirements.txt"

[[build.env]]
  PYTHON_VERSION = "3.10"

[run]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"

[[services]]
  name = "insighta-backend"
  kind = "WebService"
  [services.WebService]
    {startCommand}

[[environment]]
  KEY = "VALUE"